# KRX(유가증권·코스닥) 휴장일 / 특수 운영일 캘린더
#
# 규칙
# - covered_years에 없는 연도의 날짜를 물으면 프로그램이 예외를 냅니다(fail-closed).
#   매년 말 한국거래소 공지를 보고 다음 해 목록을 추가하세요.
# - 주말(토·일)은 자동으로 휴장입니다. 여기에는 평일 휴장만 적습니다.
# - 이미 지난 날짜는 tools/probe_market_data.py가 실제 일봉 유무와 대조해 검증합니다.
#
# 2026년 목록 출처 (2026-09-28 확인)
# - 5/25 부처님오신날 대체공휴일 휴장: 한국거래소 공식 지정 (다음 뉴스 2026-05-25)
# - 6/3 지방선거, 7/17 제헌절 휴장: 한국거래소 발표 (비즈워치 2026-05-20)
# - 9/24·25 추석 휴장, 9/28 정상 개장, 10/5 개천절 대체공휴일·10/9 한글날 휴장 (다음 뉴스 2026-09-24)
# - 나머지는 법정 공휴일·연말 휴장 관례 기준 — 지난 날짜는 프로브 대조로 확정할 것

covered_years: [2026]

holidays:
  "2026-01-01": 신정
  "2026-02-16": 설날 연휴
  "2026-02-17": 설날
  "2026-02-18": 설날 연휴
  "2026-03-02": 삼일절 대체공휴일
  "2026-05-01": 노동절
  "2026-05-05": 어린이날
  "2026-05-25": 부처님오신날 대체공휴일
  "2026-06-03": 전국동시지방선거
  "2026-07-17": 제헌절
  "2026-08-17": 광복절 대체공휴일
  "2026-09-24": 추석 연휴
  "2026-09-25": 추석
  "2026-10-05": 개천절 대체공휴일
  "2026-10-09": 한글날
  "2026-12-25": 성탄절
  "2026-12-31": 연말 휴장

# 정규장 시간이 평소(09:00~15:30)와 다른 날
# open/close는 HH:MM, closing_auction_minutes는 종가 단일가 시간(기본 10분)
special_sessions:
  "2026-01-02": {open: "10:00", close: "15:30", note: 연초 개장일 1시간 지연}
  # 수능일(11월) 개장·마감 1시간 지연 — 거래소 공지 후 추가할 것

regular_session:
  open: "09:00"
  close: "15:30"
  closing_auction_minutes: 10
