# 사용자 지정 종목 설정 예시 (스키마 w1) — docs/watchlist.md
# 실제 설정은 config/watchlist.yaml (git 제외). 시작: python tools/watchlist.py init 또는 이 파일을 복사.
# 아래 예시는 모두 비활성(관심 감시 꺼짐)입니다 — 그대로 적용해도 조회할 종목은 지수 2개뿐.
#
# code      : 6자리 종목코드 — 반드시 따옴표("005930"). 숫자로 쓰면 앞자리 0이 사라져 오류로 거부합니다.
# interest  : 관심 감시. enabled(켜기/끄기), s1_analysis(S1 분석 대상 — 보통주만), price_bands(관심 가격대, 원)
# holding   : 수동 입력 보유 정보(증권사 잔고 아님). quantity·avg_price 필수, stop_price·target_price 선택.
#             보유가 있는 동안 보유 감시는 끌 수 없습니다 — 보유가 끝나면 holding을 지우세요(holding-close).
# 한 종목이 관심과 보유를 함께 가질 수 있습니다(같은 가격 조회를 씀). 같은 코드를 두 번 쓰면 오류.
schema: w1
monitor:
  interval_sec: 60          # 장중 가격 확인 간격(다음 단계에서 사용)
  history_sessions: 160     # 준비 완료(READY)로 볼 최소 완성 일봉 수(S1 최소 이력, 거래일 달력 범위 안에서 셈)
alerts:
  repeat_limit_per_day: 3   # 같은 조건 알림 하루 최대 횟수
  min_repeat_interval_min: 30
  rearm_on_clear: true      # 조건이 풀렸다가 다시 참이 되면 새 알림
symbols:
  - code: "005930"
    name: 삼성전자
    memo: 예시 — 관심 꺼짐
    interest:
      enabled: false
      s1_analysis: true
      price_bands:
        - {low: 60000, high: 62000, label: 눌림}
  - code: "000660"
    name: SK하이닉스
    interest:
      enabled: false
      s1_analysis: false
#   holding:                # 보유 예시 — 주석을 풀면 보유 감시가 켜집니다
#     quantity: 10
#     avg_price: 180000
#     stop_price: 165000
#     target_price: 210000
